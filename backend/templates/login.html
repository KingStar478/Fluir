{% extends "auth_base.html" %}

{% block title %}Login - Fluir{% endblock %}

{% block auth_content %}
<h1 class="auth-title">Bem-vindo</h1>
<form class="form-stack" action="{{ url_for('login') }}" method="post">
    <label>
        C&oacute;digo do Porto
        <input name="codigo_porto" value="{{ form.codigo_porto if form else '' }}" maxlength="5" data-port-code required>
    </label>
    <label>
        E-mail
        <input type="email" name="email" value="{{ form.email if form else '' }}" autocomplete="email" required>
    </label>
    <label>
        Senha
        <input name="password" type="password" required>
    </label>
    <label class="checkbox-row">
        <input name="remember" type="checkbox" value="on" {% if form and form.remember %}checked{% endif %}>
        <span>Lembre de mim</span>
    </label>
    <button class="primary-button" type="submit">Entrar no sistema</button>
</form>

<div class="auth-register-box">
    <strong>N&atilde;o tem login ainda?</strong>
    <div class="auth-actions">
        <a class="secondary-button" href="{{ url_for('cadastro', tipo='Funcionario') }}">Cadastrar Funcion&aacute;rio</a>
        <a class="secondary-button" href="{{ url_for('cadastro', tipo='Porto') }}">O porto n&atilde;o possui c&oacute;digo?</a>
    </div>
</div>
{% endblock %}
