<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <title>Sem conexão - Fluir</title>
    <style>
        * { box-sizing: border-box; }
        body { align-items: center; background: #0b1220; color: #e5edf8; display: flex; font-family: Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 20px; }
        main { background: #172438; border: 1px solid #35465e; border-radius: 16px; max-width: 440px; padding: 28px; width: 100%; }
        small { color: #93c5fd; font-weight: 700; letter-spacing: .08em; }
        h1 { font-size: 25px; margin: 10px 0; }
        p { color: #c3d2e6; line-height: 1.55; margin: 0; }
        a { background: #2563eb; border-radius: 8px; color: white; display: inline-block; font-weight: 700; margin-top: 20px; padding: 11px 16px; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <small>FLUIR</small>
        <h1>Você está sem conexão</h1>
        <p>Não foi possível abrir esta página agora. Quando a conexão voltar, tente novamente. Os dados salvos no painel podem continuar disponíveis.</p>
        <a href="/login">Tentar novamente</a>
    </main>

</html>
